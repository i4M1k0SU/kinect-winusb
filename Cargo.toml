[workspace]
resolver = "3"
members = ["crates/kinect-usb", "crates/kinect10", "crates/kinect-tool"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
repository = "https://github.com/i4M1k0SU/kinect-winusb"

[workspace.dependencies]
kinect-usb = { path = "crates/kinect-usb" }
log = "0.4"
pelite = { version = "0.10", default-features = false, features = ["std"] }
# Build scripts: the VERSIONINFO resource (build/windows.rs) and its copyright year.
winresource = "0.1.34"
jiff = { version = "0.2.42", default-features = false, features = ["std"] }
windows = { version = "0.62", features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Properties",
    "Win32_Devices_Usb",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Performance",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }
# Raw ABI for the hook functions in the proxy DLL.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }

[profile.release]
lto = "fat"
codegen-units = 1
debug = "line-tables-only"
